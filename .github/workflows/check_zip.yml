on:
  push:
    branches:
      - dev

jobs:
  MakeZip:
    uses: ./.github/workflows/make_zip.yml
    secrets: inherit

  CheckZip:
    needs: MakeZip
    runs-on: ubuntu-slim
    env:
      TOOLS_DIR: .github/actions/other-repository/edge-ocr-servers/tools/ci
    steps:
      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: test_zip
          path: ${{ env.TOOLS_DIR }}
      - name: List contents of downloaded directory
        run: ls -R ${{ env.TOOLS_DIR }}
      - name: Unzip and check contents
        working-directory: ${{ env.TOOLS_DIR }}
        run: |
          # Get name of zip
          ls test_file.md
          cat test_file.md
