# Post a comment when a pull request is opened, explaining how to run the tests
name: Comment on PR
on:
  pull_request:
    types: [opened]
    branches:
      - dev

jobs:
  comment:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Post comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat <<EOF > comment.txt
          このプルリクエストにコメントを投稿するによって実行できるコマンドがあります。
          - 「/tests」: テストを実行します。
          - 「/skip_tests」: テストをスキップします。
          - 「/merge」: プルリクエストをマージします (FastForwardマージ)。

          > [!IMPORTANT]
          > 「/tests」か「/skip_tests」のいずれかを実行する必要があります。
          EOF
          gh pr \
            comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$(cat comment.txt)"
