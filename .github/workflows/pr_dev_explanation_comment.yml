# Post a comment when a pull request is opened, explaining how to run the tests
name: Comment on PR
on:
  pull_request:
    types: [opened]
    branches:
      - dev

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body \
            "テストを実行するには、「/run_tests」の内容のコメントを投稿してください。\\n" \
            "テストをスキップするには、「/skip_tests」の内容のコメントを投稿してください。"
