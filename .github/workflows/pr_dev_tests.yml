name: "PR to dev: Build and test"
on:
  # Run when PR is labelled with "run-tests" or "skip-tests"
  pull_request:
    types: [labeled]


jobs:
  BuildAndTest:
    if: contains(github.event.pull_request.labels.*.name, 'run-tests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: |
          echo "Building and running tests for ref: ${{ github.event.pull_request.head.sha }}"
          # Add your build and test commands here
          echo "Tests completed successfully."

  BuildAndTestOrSkip:
    needs: [BuildAndTest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Remove label
        run: |
          if [[ "${{ github.event.pull_request.labels.*.name }}" == *"run-tests"* ]]; then
            gh pr edit ${{ github.event.pull_request.number }} --remove-label "run-tests"
          elif [[ "${{ github.event.pull_request.labels.*.name }}" == *"skip-tests"* ]]; then
            gh pr edit ${{ github.event.pull_request.number }} --remove-label "skip-tests"
          fi
