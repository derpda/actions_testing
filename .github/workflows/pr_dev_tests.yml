on:
  workflow_dispatch:
    inputs:
      skip:
        description: "Whether to skip tests"
        type: boolean
        default: false
        required: true
      sha:
        description: "The commit SHA to run tests against"
        type: string
        required: true

jobs:
  CreateCheckRun:
    runs-on: ubuntu-latest
    outputs:
      checkrun_id: ${{ steps.create_checkrun.outputs.result }}
    steps:
      - name: Create check run
        id: create_checkrun
        uses: actions/github-script@v7
        with:
          script: |
            const skip = '${{ github.event.inputs.skip }}' === 'true';
            const title = skip ? 'Skipping tests' : 'Running tests';
            const summary = skip ? 'Tests were skipped as per request.' : 'Tests are being run as requested.';
            const response = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Build and Test or Skip',
              head_sha: '${{ github.event.inputs.sha }}',
              status: 'in_progress',
              output: {
                title: title,
                summary: summary,
              }
            });
            return response.data.id;
          result-encoding: string

  BuildAndTest:
    needs: CreateCheckRun
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref }}
      - name: Build and run tests
        run: |
          echo "Building and running tests for ref: ${{ github.event.ref }}"
          # Wait for 10 seconds to simulate build time
          sleep 10
          # Add your build and test commands here
          echo "Tests completed successfully."

  BuildAndTestOrSkip:
    needs: [CreateCheckRun, BuildAndTest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Set checkrun status to completed
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.BuildAndTest.result }}';
            const description = status === 'success' ? 'Tests passed successfully.' :
              status === 'failure' ? 'Tests failed.' : 'Tests were skipped.';
            const conclusion = status === 'success' ? 'success' :
              status === 'failure' ? 'failure' : 'success';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: ${{ needs.CreateCheckRun.outputs.checkrun_id }},
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: 'Tests completed',
                summary: description
              }
            });
