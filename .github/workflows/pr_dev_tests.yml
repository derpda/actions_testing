on:
  workflow_dispatch:
    inputs:
      skip:
        description: "Whether to skip tests"
        type: boolean
        default: false
        required: true

jobs:
  BuildAndTest:
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref }}
      - name: Build and run tests
        run: |
          echo "Building and running tests for ref: ${{ github.event.ref }}"
          # Add your build and test commands here
          echo "Tests completed successfully."

  BuildAndTestOrSkip:
    needs: [BuildAndTest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Run or skip tests based on previous steps
        run: |
          if [[ "${{ needs.BuildAndTest.result }}" == "success" ]]; then
            echo "Tests were run successfully."
          elif [[ "${{ needs.BuildAndTest.result }}" == "failure" ]]; then
            echo "Tests failed."
            exit 1
          else
            echo "Tests were skipped."
          fi
