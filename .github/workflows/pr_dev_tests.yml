on:
  workflow_call:
    inputs:
      commit_ref:
        description: "Commit reference to build and test"
        type: string
        required: true

jobs:
  BuildAndTest:
    # NOTE: Only run if commit_ref is provided.
    if: ${{ inputs.commit_ref != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_ref }}
      - name: Build and run tests
        run: |
          echo "Building and running tests for commit: ${{ inputs.commit_ref }}"
          # Add your build and test commands here
          echo "Tests completed successfully."

  Skip:
    # NOTE: Only run if commit_ref is NOT provided.
    if: ${{ inputs.commit_ref == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Tests skipped
        run: |
          echo "Tests skipped as per request."

  BuildAndTestOrSkip:
    needs: [BuildAndTest, Skip]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Set commit status
        uses: actions/github-script@v6
        with:
          script: |
            const status = '${{ needs.BuildAndTest.result }}';
            const context = 'Build and Test';
            const description = status === 'success' ? 'Tests passed successfully.' :
              status === 'failure' ? 'Tests failed.' : 'Tests were skipped.';
            const state = status === 'success' ? 'success' :
              status === 'failure' ? 'failure' : 'neutral';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              context: context,
              description: description,
            });
