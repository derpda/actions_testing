name: PR Dev Tests
on:
  issue_comment:
    types: [created]

concurrency:
  group: pr-comment-reactions
  cancel-in-progress: false
jobs:
  SkipTests:
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '/tests' }}
    runs-on: ubuntu-latest
    steps:
      - name: Tests skipped
        run: |
          echo "Tests skipped as per request."

  GetRefsForTests:
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '/run_tests' }}
    runs-on: ubuntu-latest
    outputs:
      base_ref: ${{ steps.get_refs.outputs.base_ref }}
      head_ref: ${{ steps.get_refs.outputs.head_ref }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: xt0rted/pull-request-comment-branch@v3
        id: get_refs
      - name: Ensure base is dev
        run: |
          echo "${{ steps.get_refs.outputs.base_ref }}"
          if [[ "${{ steps.get_refs.outputs.base_ref }}" != "dev" ]]; then
            echo "This PR must target the dev branch to run tests."
            exit 1
          fi

  RunTests:
    needs: GetRefsForTests
    if: ${{ needs.GetRefsForTests.result == 'success' }}
    uses: ./.github/workflows/pr_dev_tests.yml
    with:
      commit_ref: ${{ needs.GetRefsForTests.outputs.head_ref }}

  RunOrSkipTests:
    needs: [SkipTests, RunTests]
    if: ${{ !cancelled() && (needs.SkipTests.result != 'skipped' || needs.RunTests.result != 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Run or skip tests based on previous steps
        run: |
          if [[ "${{ needs.RunTests.result }}" == "success" ]]; then
            echo "Tests were run successfully."
          elif [[ "${{ needs.RunTests.result }}" == "failure" ]]; then
            echo "Tests failed."
            exit 1
          else
            echo "Tests were skipped."
          fi

  FastForwardMerge:
    # Only run if the comment contains the /merge command.
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '/merge' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Fast forwarding merging the PR
        uses: sequoia-pgp/fast-forward@v1
        with:
          merge: true
          # To reduce the workflow's verbosity, use 'on-error'
          # to only post a comment when an error occurs, or 'never' to
          # never post a comment.  (In all cases the information is
          # still available in the step's summary.)
          comment: always
