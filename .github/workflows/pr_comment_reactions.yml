name: "Comment on PR: Handle commands"
on:
  issue_comment:
    types: [created]

concurrency:
  group: pr-comment-reactions
  cancel-in-progress: false
jobs:
  GetRefsForTests:
    if: ${{ github.event.issue.pull_request && (github.event.comment.body == '/tests' || github.event.comment.body == '/skip_tests')}}
    runs-on: ubuntu-latest
    outputs:
      head_ref: ${{ steps.output_head_ref.outputs.head_ref }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: xt0rted/pull-request-comment-branch@v3
        if: ${{ github.event.comment.body == '/tests' }}
        id: get_refs
      - name: Ensure base is dev
        if: ${{ github.event.comment.body == '/tests' }}
        run: |
          echo "${{ steps.get_refs.outputs.base_ref }}"
          if [[ "${{ steps.get_refs.outputs.base_ref }}" != "dev" ]]; then
            echo "This PR must target the dev branch to run tests."
            exit 1
          fi
      - name: Output head ref
        id: output_head_ref
        run: |
          if [[ ${{ github.event.comment.body == '/tests' }} ]]; then
            echo "head_ref=${{ steps.get_refs.outputs.head_ref }}" >> $GITHUB_OUTPUT
          else
            # If the command is /skip_tests, we don't need to set head_ref
            echo "head_ref=" >> $GITHUB_OUTPUT
          fi

  RunOrSkipTests:
    needs: GetRefsForTests
    if: ${{ needs.GetRefsForTests.result == 'success' }}
    uses: ./.github/workflows/pr_dev_tests.yml
    with:
      # NOTE: Tests will only run if the head_ref is set.
      commit_ref: ${{ needs.GetRefsForTests.outputs.head_ref }}

  FastForwardMerge:
    # Only run if the comment contains the /merge command.
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '/merge' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Fast forwarding merging the PR
        uses: sequoia-pgp/fast-forward@v1
        with:
          merge: true
          # To reduce the workflow's verbosity, use 'on-error'
          # to only post a comment when an error occurs, or 'never' to
          # never post a comment.  (In all cases the information is
          # still available in the step's summary.)
          comment: always
