name: "Comment on PR: Handle commands"
on:
  issue_comment:
    types: [created]

concurrency:
  group: pr-comment-reactions
  cancel-in-progress: false
jobs:
  RunOrSkipTests:
    if: ${{ github.event.issue.pull_request && (github.event.comment.body == '/tests' || github.event.comment.body == '/skip_tests')}}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write
    steps:
      - uses: xt0rted/pull-request-comment-branch@v3
        id: get_refs
      - name: Ensure base is dev
        run: |
          echo "${{ steps.get_refs.outputs.base_ref }}"
          if [[ "${{ steps.get_refs.outputs.base_ref }}" != "dev" ]]; then
            echo "This PR must target the dev branch to run tests."
            exit 1
          fi
      - name: Starts tests run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr_dev_tests.yml',
              ref: '${{ steps.get_refs.outputs.head_ref }}',
              inputs: {
                skip: '${{ github.event.comment.body == '/skip_tests' }}',
                sha: '${{ steps.get_refs.outputs.head_sha }}'
              }
            });

  FastForwardMerge:
    # Only run if the comment contains the /merge command.
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '/merge' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Fast forwarding merging the PR
        uses: sequoia-pgp/fast-forward@v1
        with:
          merge: true
          # To reduce the workflow's verbosity, use 'on-error'
          # to only post a comment when an error occurs, or 'never' to
          # never post a comment.  (In all cases the information is
          # still available in the step's summary.)
          comment: always
